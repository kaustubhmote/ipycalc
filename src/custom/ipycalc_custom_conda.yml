name: ipycalc_conda_env
channels:
  - defaults
  - conda-forge
dependencies:
  - python
  - numpy
  - scipy
  - matplotlib
  - ipython
  - uncertainties
  - pint
  - pendulum
  - rich
  - sympy
  - pip
  - pip:
    - -e /opt/nmrware/nmrglue 
    - -e /opt/nmrware/pulseplot
    - -e /opt/nmrware/tins
